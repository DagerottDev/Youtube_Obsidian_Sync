name: Attest release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attest, for example 0.1.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the plugin
        run: npm run build

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          test "$(node -p "require('./manifest.json').version")" = "$RELEASE_TAG"

      - name: Generate main.js provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: main.js

      - name: Generate manifest.json provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: manifest.json
